<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>NovaSISS - UMSS</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:linear-gradient(
        135deg,
        #f8f6fb,
        #eef3ff
    );

    font-family:'Segoe UI', Arial, sans-serif;

}



/* TARJETA */

.login-card{

    width:420px;

    background:white;

    padding:45px;

    border-radius:25px;

    box-shadow:
    0 15px 35px rgba(0,0,0,0.12);

    text-align:center;

}



/* LOGO NOVASISS */

.logo-container{

    margin-bottom:20px;

}


.logo{

    font-size:45px;

    font-weight:800;

    letter-spacing:1px;

}



.nova{

    color:#e86bb5;

}


.siss{

    color:#213f91;

}



.umss{

    margin-top:-5px;

    color:#213f91;

    font-size:18px;

    font-weight:bold;

    letter-spacing:5px;

}



/* TITULOS */


h2{

    color:#213f91;

    margin-bottom:5px;

}



.subtitle{

    color:#777;

    font-size:15px;

    margin-bottom:25px;

}




.welcome{

    color:#e86bb5;

    font-size:18px;

    font-weight:bold;

}



/* CAMPOS */


.input-group{

    text-align:left;

    margin-top:18px;

}



label{

    color:#555;

    font-size:14px;

}



input{


    width:100%;

    margin-top:8px;

    padding:14px;

    border-radius:12px;

    border:1px solid #ddd;

    font-size:15px;


}



input:focus{

    outline:none;

    border-color:#e86bb5;

}




/* RECORDAR */

.options{

    text-align:right;

    margin-top:10px;

}


.options a{

    color:#e86bb5;

    font-size:13px;

    text-decoration:none;

}



/* BOTON */


button{


    width:100%;

    margin-top:25px;

    padding:15px;


    border:none;

    border-radius:15px;


    background:#213f91;


    color:white;


    font-size:17px;

    font-weight:bold;


    cursor:pointer;


    transition:.3s;


}



button:hover{

    background:#e86bb5;

}



/* ERROR */


.error{

    color:red;

    margin-top:15px;

}



/* PIE */


.footer{

    margin-top:25px;

    color:#999;

    font-size:13px;

}



</style>


</head>


<body>



<div class="login-card">



<div class="logo-container">


<div class="logo">

<span class="nova">
Nova
</span><span class="siss">
SISS
</span>


</div>


<div class="umss">
UMSS
</div>


</div>





<h2>
Sistema Académico Inteligente
</h2>



<p class="subtitle">
Universidad Mayor de San Simón
</p>



<p class="welcome">
Hola, bienvenido/a 🌸
</p>



<p>
Ingresa tus datos para continuar
</p>





<form method="POST">


{% csrf_token %}




<div class="input-group">

<label>
Código SIS
</label>


<input

type="text"

name="codigo_sis"

placeholder="Ingrese su código SIS"

required>

</div>





<div class="input-group">


<label>
Contraseña
</label>


<input

type="password"

name="password"

placeholder="Ingrese su contraseña"

required>


</div>





<div class="options">

<a href="#">
¿Olvidaste tu contraseña?
</a>

</div>





<button type="submit">

Ingresar ➜

</button>




</form>





{% if error %}

<div class="error">

{{ error }}

</div>

{% endif %}





<div class="footer">

NovaSISS - UMSS 🌸💙

</div>



</div>



</body>

</html>
